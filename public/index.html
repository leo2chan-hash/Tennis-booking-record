<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#12372b">
  <meta name="description" content="Mobile-friendly tennis booking record and live dashboard">
  <title>Tennis Booking Live</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%2312372b'/%3E%3Ccircle cx='32' cy='32' r='19' fill='%23d7ff62'/%3E%3Cpath d='M18 20c9 5 15 14 17 27M46 17c-8 7-13 17-13 30' fill='none' stroke='%2312372b' stroke-width='3'/%3E%3C/svg%3E">
  <style>
    :root{--ink:#12231d;--muted:#66756f;--green:#12372b;--lime:#d7ff62;--paper:#f5f7f2;--card:#fff;--line:#dfe6df;--danger:#b42318;--shadow:0 12px 32px rgba(18,55,43,.10);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink);background:var(--paper)}
    *{box-sizing:border-box}body{margin:0;background:var(--paper);font-size:16px;padding-bottom:calc(86px + env(safe-area-inset-bottom))}button,input,select,textarea{font:inherit}.shell{width:min(100%,760px);margin:auto;padding:0 16px}
    header{background:var(--green);color:white;padding:calc(18px + env(safe-area-inset-top)) 0 24px;border-radius:0 0 28px 28px;box-shadow:var(--shadow)}
    .brandrow,.row,.sectionhead,.cardtop,.actions{display:flex;align-items:center}.brandrow,.sectionhead,.cardtop{justify-content:space-between}.eyebrow{font-size:.76rem;letter-spacing:.11em;text-transform:uppercase;color:#b6c8c0;font-weight:800}.brand{margin:.2rem 0 0;font-size:1.65rem;line-height:1.15}.live{display:flex;align-items:center;gap:7px;background:rgba(255,255,255,.11);padding:8px 11px;border-radius:999px;font-size:.78rem}.dot{width:8px;height:8px;background:var(--lime);border-radius:50%;box-shadow:0 0 0 4px rgba(215,255,98,.15)}
    .hero{margin-top:-10px}.next{background:linear-gradient(135deg,#e8ffc0,#d7ff62);border:1px solid #c7ee52;border-radius:24px;padding:20px;box-shadow:var(--shadow)}.next .label{font-size:.78rem;font-weight:900;letter-spacing:.08em;text-transform:uppercase}.next h2{font-size:1.45rem;margin:8px 0}.nextmeta{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:16px}.meta{background:rgba(255,255,255,.55);border-radius:14px;padding:11px}.meta small{display:block;color:#536348;margin-bottom:3px}.empty-next{text-align:center;padding:8px}.empty-next p{margin:.35rem 0 1rem;color:#536348}
    .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:16px 0}.stat{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px 10px;text-align:center}.stat b{display:block;font-size:1.35rem}.stat span{color:var(--muted);font-size:.78rem}
    section{margin:24px 0}.sectionhead h2{font-size:1.15rem;margin:0}.sectionhead small{color:var(--muted)}.tools{display:grid;grid-template-columns:1fr auto;gap:10px;margin:13px 0}.control{width:100%;min-height:46px;border:1px solid var(--line);border-radius:14px;background:white;padding:0 13px;color:var(--ink);outline:none}.control:focus{border-color:#6a8f80;box-shadow:0 0 0 3px rgba(18,55,43,.1)}
    .bookings{display:grid;gap:12px}.booking{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:17px;box-shadow:0 5px 18px rgba(18,55,43,.05)}.dateblock b{font-size:1.02rem}.dateblock small{display:block;color:var(--muted);margin-top:3px}.status{font-size:.72rem;font-weight:850;padding:6px 9px;border-radius:999px}.Confirmed{background:#e7f8ed;color:#17613a}.Pending{background:#fff3cf;color:#7a5200}.Completed{background:#e9edf0;color:#48535a}.Cancelled{background:#fde8e7;color:#9e2922}.venue{font-weight:800;font-size:1.05rem;margin:15px 0 9px}.tags{display:flex;flex-wrap:wrap;gap:7px}.tag{background:#eff3ef;border-radius:999px;padding:7px 10px;font-size:.8rem}.tag.booker{background:var(--green);color:white}.court{background:#ecffd0}.note{color:var(--muted);font-size:.88rem;margin:12px 0 0;border-left:3px solid var(--lime);padding-left:10px}.actions{gap:8px;margin-top:14px}.btn{border:0;border-radius:13px;padding:11px 14px;font-weight:800;cursor:pointer;min-height:44px}.btn.primary{background:var(--green);color:white}.btn.lime{background:var(--lime);color:var(--green)}.btn.soft{background:#edf2ee;color:var(--green)}.btn.danger{background:#fff0ef;color:var(--danger)}.btn.icon{width:44px;padding:0}.empty{background:white;border:1px dashed #c9d3cc;border-radius:20px;text-align:center;padding:34px 18px;color:var(--muted)}
    .bottom{position:fixed;z-index:20;left:0;right:0;bottom:0;background:rgba(255,255,255,.94);backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:9px 16px calc(9px + env(safe-area-inset-bottom))}.bottomin{width:min(100%,760px);margin:auto;display:grid;grid-template-columns:1fr 1.35fr 1fr;gap:8px}.navbtn{border:0;background:transparent;color:var(--muted);font-size:.75rem;font-weight:750;padding:5px}.navbtn span{display:block;font-size:1.25rem;margin-bottom:2px}.addmain{background:var(--green);color:white;border-radius:15px}
    dialog{border:0;padding:0;width:min(calc(100% - 24px),620px);max-height:90dvh;border-radius:24px;box-shadow:0 24px 80px rgba(0,0,0,.28)}dialog::backdrop{background:rgba(9,25,19,.54);backdrop-filter:blur(3px)}.modal{padding:20px;overflow:auto;max-height:90dvh}.modalhead{display:flex;justify-content:space-between;align-items:center;position:sticky;top:-20px;background:white;padding:2px 0 14px;z-index:2}.modalhead h2{margin:0;font-size:1.25rem}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{margin:13px 0}.field label{font-size:.82rem;font-weight:800;display:block;margin-bottom:7px}.field textarea{padding-top:12px;min-height:78px;resize:vertical}.chips{display:flex;flex-wrap:wrap;gap:8px}.choice{position:relative}.choice input{position:absolute;opacity:0}.choice label{display:block;border:1px solid var(--line);border-radius:999px;padding:9px 12px;background:white;font-weight:700;font-size:.86rem}.choice input:checked+label{background:var(--green);border-color:var(--green);color:white}.courtrow{border:1px solid var(--line);background:#f8faf7;border-radius:16px;padding:11px;margin-bottom:10px}.courttop{display:grid;grid-template-columns:1fr 46px;gap:8px;margin-bottom:9px}.courttimes{display:grid;grid-template-columns:1fr 1fr;gap:8px}.courttimes small{display:block;color:var(--muted);font-size:.75rem;margin:0 0 4px 3px}.modalactions{display:grid;grid-template-columns:1fr 1.4fr;gap:10px;margin-top:20px}.playerrow{display:grid;grid-template-columns:1fr auto;gap:8px;margin-bottom:9px}.playeritem{display:flex;justify-content:space-between;align-items:center;padding:11px 0;border-bottom:1px solid var(--line)}.toast{position:fixed;z-index:40;left:50%;bottom:100px;transform:translate(-50%,20px);background:#12231d;color:white;border-radius:999px;padding:11px 17px;opacity:0;transition:.2s;pointer-events:none;font-size:.86rem}.toast.show{opacity:1;transform:translate(-50%,0)}
    @media(min-width:640px){.shell{padding:0 24px}.stats{gap:14px}.booking{padding:20px}.bookings{grid-template-columns:1fr 1fr}.bookings .empty{grid-column:1/-1}.nextmeta{grid-template-columns:repeat(4,1fr)}}
  </style>
</head>
<body>
  <header><div class="shell brandrow"><div><div class="eyebrow">Friend Tennis Group</div><h1 class="brand">Tennis Booking</h1></div><div class="live"><i class="dot"></i><span id="liveTime">Live</span></div></div></header>
  <main class="shell">
    <section class="hero"><div class="next" id="nextGame"></div></section>
    <div class="stats"><div class="stat"><b id="games">0</b><span>Bookings</span></div><div class="stat"><b id="playersStat">0</b><span>Players</span></div><div class="stat"><b id="hours">0</b><span>Court hrs</span></div></div>
    <section id="bookingSection"><div class="sectionhead"><div><h2>Booking record</h2><small id="updated">Updated now</small></div><button class="btn soft icon" onclick="openData()" aria-label="Data tools">•••</button></div><div class="tools"><input class="control" id="search" placeholder="Search venue or player" oninput="render()"><select class="control" id="filter" onchange="render()"><option>All</option><option>Confirmed</option><option>Pending</option><option>Completed</option><option>Cancelled</option></select></div><div class="bookings" id="list"></div></section>
  </main>
  <nav class="bottom"><div class="bottomin"><button class="navbtn" onclick="scrollTo({top:0,behavior:'smooth'})"><span>⌂</span>Home</button><button class="navbtn addmain" onclick="openBooking()"><span>＋</span>Add booking</button><button class="navbtn" onclick="openPlayers()"><span>♟</span>Players</button></div></nav>

  <dialog id="bookingDialog"><form class="modal" id="bookingForm" onsubmit="saveBooking(event)"><div class="modalhead"><h2 id="formTitle">Add booking</h2><button type="button" class="btn soft icon" onclick="bookingDialog.close()">×</button></div><input type="hidden" id="bookingId"><div class="field"><label>Date</label><input class="control" id="date" type="date" required></div><div class="grid2"><div class="field"><label>Start time</label><input class="control" id="start" type="time" required></div><div class="field"><label>End time</label><input class="control" id="end" type="time" required></div></div><div class="field"><label>Court / venue name</label><input class="control" id="venue" placeholder="Victoria Park" required></div><div class="field"><div class="sectionhead"><label>Court number(s)</label><button type="button" class="btn soft" onclick="addCourt()">+ Court</button></div><div id="courtInputs"></div></div><div class="field"><label>Players</label><div class="playerrow"><input class="control" id="quickPlayer" placeholder="Add a new player"><button type="button" class="btn soft" onclick="addPlayerFromBooking()">+ Add</button></div><div class="chips" id="playerChoices"></div></div><div class="grid2"><div class="field"><label>Booker 1</label><select class="control" id="booker1" required></select></div><div class="field"><label>Booker 2</label><select class="control" id="booker2"></select></div></div><div class="field"><label>Status</label><select class="control" id="status"><option>Confirmed</option><option>Pending</option><option>Completed</option><option>Cancelled</option></select></div><div class="field"><label>Remarks</label><textarea class="control" id="remarks" placeholder="Balls, payment or other notes"></textarea></div><div class="modalactions"><button type="button" class="btn soft" onclick="bookingDialog.close()">Cancel</button><button class="btn primary">Save booking</button></div></form></dialog>
  <dialog id="playerDialog"><div class="modal"><div class="modalhead"><h2>Manage players</h2><button class="btn soft icon" onclick="playerDialog.close()">×</button></div><div class="playerrow"><input class="control" id="newPlayer" placeholder="Player name"><button class="btn primary" onclick="addPlayer()">Add</button></div><div id="playerList"></div></div></dialog>
  <dialog id="dataDialog"><div class="modal"><div class="modalhead"><h2>Data tools</h2><button class="btn soft icon" onclick="dataDialog.close()">×</button></div><p style="color:var(--muted);line-height:1.55">These records are shared online. Everyone using this site sees the same bookings. Export a backup before making major changes.</p><div style="display:grid;gap:10px"><button class="btn primary" onclick="exportData()">Export backup</button><button class="btn soft" onclick="document.getElementById('importFile').click()">Import backup</button><input hidden id="importFile" type="file" accept="application/json" onchange="importData(event)"><button class="btn danger" onclick="clearAll()">Clear all bookings</button></div></div></dialog>
  <div class="toast" id="toast"></div>
  <script>
    const DEFAULT_PLAYERS=['James','Philip','Chris','Tony'];
    let state={players:DEFAULT_PLAYERS,bookings:[],revision:0,updated:Date.now()}; const $=id=>document.getElementById(id); const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
    async function loadRemote(silent=false){try{const r=await fetch('/api/data',{cache:'no-store'});if(!r.ok)throw new Error('Cannot load shared records');const x=await r.json();state={...x.data,revision:x.revision,updated:Date.parse(x.updatedAt)||Date.now()};render();if(!silent)toast('Shared records loaded')}catch(e){toast(e.message||'Database unavailable')}}
    async function persist(msg='Saved'){const snapshot={players:state.players,bookings:state.bookings};render();try{const r=await fetch('/api/data',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({data:snapshot,expectedRevision:state.revision})});const x=await r.json();if(r.status===409){state={...x.data,revision:x.revision,updated:Date.parse(x.updatedAt)||Date.now()};render();return toast('Another person updated the list. Latest data loaded.')}if(!r.ok)throw new Error(x.error||'Save failed');state={...x.data,revision:x.revision,updated:Date.parse(x.updatedAt)||Date.now()};render();toast(msg)}catch(e){toast(e.message||'Database unavailable');await loadRemote(true)}}
    function toast(msg){$('toast').textContent=msg;$('toast').classList.add('show');setTimeout(()=>$('toast').classList.remove('show'),1700)}
    function normalizeCourts(b){return (b.courts||[]).map(c=>typeof c==='string'?{number:c,start:b.start,end:b.end}:c)}
    function dt(b){return new Date(`${b.date}T${b.start}`)} function fmtDate(s){return new Date(s+'T00:00').toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric',year:'numeric'})}
    function duration(b){return normalizeCourts(b).reduce((sum,c)=>{const [a,m]=c.start.split(':').map(Number),[z,n]=c.end.split(':').map(Number);return sum+Math.max(0,(z*60+n-a*60-m)/60)},0)}
    function nextBooking(){return [...state.bookings].filter(b=>b.status!=='Cancelled'&&dt(b)>=new Date()).sort((a,b)=>dt(a)-dt(b))[0]}
    function renderNext(){const b=nextBooking(),courts=b?normalizeCourts(b):[];$('nextGame').innerHTML=b?`<div class="cardtop"><span class="label">Next game</span><span class="status ${esc(b.status)}">${esc(b.status)}</span></div><h2>${fmtDate(b.date)}</h2><div class="nextmeta"><div class="meta"><small>Overall time</small><b>${esc(b.start)}–${esc(b.end)}</b></div><div class="meta"><small>Venue</small><b>${esc(b.venue)}</b></div><div class="meta"><small>Courts</small><b>${courts.map(c=>`${esc(c.number)} (${esc(c.start)}–${esc(c.end)})`).join('<br>')}</b></div><div class="meta"><small>Players</small><b>${b.players.length}</b></div></div>`:`<div class="empty-next"><span class="label">Next game</span><h2>No upcoming booking</h2><p>Add a court booking and it will appear here.</p><button class="btn primary" onclick="openBooking()">Add first booking</button></div>`}
    function render(){renderNext();const valid=state.bookings.filter(b=>b.status!=='Cancelled');$('games').textContent=valid.length;$('playersStat').textContent=new Set(valid.flatMap(b=>b.players)).size;$('hours').textContent=valid.reduce((n,b)=>n+duration(b),0).toFixed(1);$('updated').textContent='Updated '+new Date(state.updated).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});const q=$('search').value.toLowerCase(),f=$('filter').value;const rows=[...state.bookings].filter(b=>(f==='All'||b.status===f)&&[b.venue,...b.players,...normalizeCourts(b).map(c=>c.number)].join(' ').toLowerCase().includes(q)).sort((a,b)=>dt(a)-dt(b));$('list').innerHTML=rows.length?rows.map(card).join(''):`<div class="empty"><b>No bookings found</b><p>Add a booking or change the filter.</p></div>`}
    function card(b){const bookers=[b.booker1,b.booker2].filter(Boolean);return `<article class="booking"><div class="cardtop"><div class="dateblock"><b>${fmtDate(b.date)}</b><small>${esc(b.start)}–${esc(b.end)} overall</small></div><span class="status ${esc(b.status)}">${esc(b.status)}</span></div><div class="venue">⌖ ${esc(b.venue)}</div><div class="tags">${normalizeCourts(b).map(c=>`<span class="tag court">Court ${esc(c.number)} · ${esc(c.start)}–${esc(c.end)}</span>`).join('')}${b.players.map(x=>`<span class="tag ${bookers.includes(x)?'booker':''}">${bookers.includes(x)?'★ ':''}${esc(x)}</span>`).join('')}</div>${b.remarks?`<p class="note">${esc(b.remarks)}</p>`:''}<div class="actions"><button class="btn soft" onclick="openBooking('${b.id}')">Edit</button><button class="btn danger" onclick="removeBooking('${b.id}')">Delete</button></div></article>`}
    function openBooking(id=''){const b=state.bookings.find(x=>x.id===id);$('formTitle').textContent=b?'Edit booking':'Add booking';$('bookingId').value=b?.id||'';$('date').value=b?.date||new Date().toISOString().slice(0,10);$('start').value=b?.start||'19:00';$('end').value=b?.end||'21:00';$('venue').value=b?.venue||'';$('status').value=b?.status||'Confirmed';$('remarks').value=b?.remarks||'';$('courtInputs').innerHTML='';(b?.courts?.length?normalizeCourts(b):[{number:'',start:$('start').value,end:$('end').value}]).forEach(addCourt);renderPlayerChoices(b?.players||[]);refreshBookers(b?.booker1||'',b?.booker2||'');bookingDialog.showModal()}
    function addCourt(value={}){const c=typeof value==='string'?{number:value,start:$('start').value,end:$('end').value}:value;const row=document.createElement('div');row.className='courtrow';row.innerHTML=`<div class="courttop"><input class="control courtNumber" placeholder="Court number, e.g. 3" value="${esc(c.number||'')}"><button type="button" class="btn danger icon" onclick="this.closest('.courtrow').remove()">×</button></div><div class="courttimes"><label><small>Start time</small><input class="control courtStart" type="time" value="${esc(c.start||$('start').value)}"></label><label><small>End time</small><input class="control courtEnd" type="time" value="${esc(c.end||$('end').value)}"></label></div>`;$('courtInputs').appendChild(row)}
    function renderPlayerChoices(selected=[]){$('playerChoices').innerHTML=state.players.map((p,i)=>`<span class="choice"><input type="checkbox" id="p${i}" value="${esc(p)}" ${selected.includes(p)?'checked':''} onchange="refreshBookers()"><label for="p${i}">${esc(p)}</label></span>`).join('')}
    function selectedPlayers(){return [...document.querySelectorAll('#playerChoices input:checked')].map(x=>x.value)}
    function refreshBookers(v1=$('booker1').value,v2=$('booker2').value){const p=selectedPlayers();$('booker1').innerHTML='<option value="">Select</option>'+p.map(x=>`<option>${esc(x)}</option>`).join('');$('booker2').innerHTML='<option value="">None</option>'+p.map(x=>`<option>${esc(x)}</option>`).join('');if(p.includes(v1))$('booker1').value=v1;if(p.includes(v2))$('booker2').value=v2}
    function saveBooking(e){e.preventDefault();const players=selectedPlayers(),courts=[...document.querySelectorAll('.courtrow')].map(r=>({number:r.querySelector('.courtNumber').value.trim(),start:r.querySelector('.courtStart').value,end:r.querySelector('.courtEnd').value})).filter(c=>c.number);if(!players.length)return toast('Select at least one player');if(!courts.length)return toast('Add at least one court number');if(courts.some(c=>!c.start||!c.end||c.end<=c.start))return toast('Check each court time');if($('booker2').value&&$('booker2').value===$('booker1').value)return toast('Choose a different second booker');const overallStart=courts.map(c=>c.start).sort()[0],overallEnd=courts.map(c=>c.end).sort().at(-1);const id=$('bookingId').value||crypto.randomUUID();const data={id,date:$('date').value,start:overallStart,end:overallEnd,venue:$('venue').value.trim(),courts,players,booker1:$('booker1').value,booker2:$('booker2').value,status:$('status').value,remarks:$('remarks').value.trim()};const i=state.bookings.findIndex(x=>x.id===id);i<0?state.bookings.push(data):state.bookings[i]=data;bookingDialog.close();persist(i<0?'Booking added':'Booking updated')}
    function removeBooking(id){if(confirm('Delete this booking?')){state.bookings=state.bookings.filter(x=>x.id!==id);persist('Booking deleted')}}
    function openPlayers(){renderPlayerList();playerDialog.showModal()} function renderPlayerList(){$('playerList').innerHTML=state.players.map((p,i)=>`<div class="playeritem"><b>${esc(p)}</b><button class="btn danger" onclick="removePlayer(${i})">Remove</button></div>`).join('')||'<div class="empty">No players yet</div>'}
    function addPlayer(){const n=$('newPlayer').value.trim();if(!n)return;if(state.players.some(x=>x.toLowerCase()===n.toLowerCase()))return toast('Player already exists');state.players.push(n);$('newPlayer').value='';renderPlayerList();persist('Player added')}
    function addPlayerFromBooking(){const input=$('quickPlayer'),n=input.value.trim();if(!n)return toast('Enter a player name');if(state.players.some(x=>x.toLowerCase()===n.toLowerCase()))return toast('Player already exists');const selected=selectedPlayers();state.players.push(n);renderPlayerChoices([...selected,n]);refreshBookers();input.value='';persist('Player added and selected')}
    function removePlayer(i){const p=state.players[i];if(state.bookings.some(b=>b.players.includes(p))&&!confirm(`${p} appears in booking history. Remove from player list?`))return;state.players.splice(i,1);renderPlayerList();persist('Player removed')}
    function openData(){dataDialog.showModal()} function exportData(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(state,null,2)],{type:'application/json'}));a.download=`tennis-bookings-${new Date().toISOString().slice(0,10)}.json`;a.click();URL.revokeObjectURL(a.href);toast('Backup exported')}
    function importData(e){const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const x=JSON.parse(r.result);if(!Array.isArray(x.players)||!Array.isArray(x.bookings))throw 0;state={players:x.players,bookings:x.bookings,revision:state.revision,updated:Date.now()};dataDialog.close();persist('Backup imported')}catch{toast('Invalid backup file')}};r.readAsText(f);e.target.value=''}
    function clearAll(){if(confirm('Clear all booking records?')){state.bookings=[];dataDialog.close();persist('Bookings cleared')}}
    setInterval(()=>{$('liveTime').textContent=new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})},1000);setInterval(()=>{if(!document.querySelector('dialog[open]'))loadRemote(true)},15000);render();loadRemote();
  </script>
</body>
</html>
